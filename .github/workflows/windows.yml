name: Windows skill installation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Test installation and independent updates
        shell: pwsh
        run: '& ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./tests/windows.ps1'
